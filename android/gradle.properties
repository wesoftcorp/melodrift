# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# AndroidX migration
android.useAndroidX=true
android.enableJetifier=true

# JVM memory - prevents GC thrashing on large projects
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Build performance
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true

# Kotlin - incremental disabled to prevent cache corruption on Windows
kotlin.incremental=false
kotlin.caching.enabled=false

# Suppress compileSdk AAR metadata checks for plugins that pin old compileSdkVersions
# (isar_flutter_libs=30, connectivity_plus=33 — produce errors with newer androidx deps)
android.suppressUnsupportedCompileSdk=36
