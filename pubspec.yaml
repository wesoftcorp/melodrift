name: melodrift
description: "Let the music drift - Premium YouTube Music client"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Hooks
  flutter_riverpod: ^2.5.1
  hooks_riverpod: ^2.5.1
  flutter_hooks: ^0.20.5

  # Navigation
  auto_route: ^7.9.2

  # Audio Playback
  just_audio: ^0.9.38
  audio_service: ^0.18.12

  # YouTube Music Backend
  youtube_explode_dart: ^2.2.2

  # Network
  dio: ^5.4.1

  # Database & Local Storage
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.6
  path: ^1.9.0

  # Translation
  google_mlkit_translation: ^0.11.0

  # Firebase (Opt-in)
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.8
  firebase_database: ^10.4.9
  firebase_crashlytics: ^3.4.18
  firebase_analytics: ^10.8.9
  google_sign_in: ^6.2.1

  # UI & Styling
  flex_color_scheme: ^8.4.0
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8

  # Animations
  lottie: ^3.1.0
  rive: ^0.13.0

  # Images
  cached_network_image: ^3.3.1
  flutter_blurhash: ^0.8.2

  # Notifications & WorkManager
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.5.2
  home_widget: ^0.4.0

  # Connectivity
  connectivity_plus: ^5.0.2

  # Speech to Text
  speech_to_text: ^6.6.0
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.8
  auto_route_generator: ^7.3.2
  isar_generator: ^3.1.0+1
  rxdart: ^0.28.0

  # Flavors Configuration
  flutter_flavorizr: ^2.2.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/

flavorizr:
  flavors:
    devFoss:
      app:
        name: "Melodrift Dev FOSS"
      android:
        applicationId: "com.melodrift.dev.foss"
      ios:
        bundleId: "com.melodrift.dev.foss"
    prodFoss:
      app:
        name: "Melodrift FOSS"
      android:
        applicationId: "com.melodrift.foss"
      ios:
        bundleId: "com.melodrift.foss"
    devFull:
      app:
        name: "Melodrift Dev"
      android:
        applicationId: "com.melodrift.dev"
      ios:
        bundleId: "com.melodrift.dev"
    prodFull:
      app:
        name: "Melodrift"
      android:
        applicationId: "com.melodrift"
      ios:
        bundleId: "com.melodrift"
