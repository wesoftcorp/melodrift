<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melodrift YouTube Stream Resolver</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #131313;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            color: #b3b3b3;
            font-size: 1.1rem;
            line-height: 1.6;
        }
        .status {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            border-radius: 30px;
            background-color: rgba(75, 181, 67, 0.1);
            color: #4bb543;
            font-weight: bold;
            font-size: 0.9rem;
            border: 1px solid rgba(75, 181, 67, 0.2);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Melodrift Stream Resolver</h1>
        <p>This is the serverless API instance powering high-quality YouTube playback for the Melodrift Music Player.</p>
        <div class="status">● System Operational</div>
    </div>
</body>
</html>
